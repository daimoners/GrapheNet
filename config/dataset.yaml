randomly:
  n_items: 7000
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  shuffle: True
  oxygen_outliers_th: 0.2
  min_num_atoms: 0

from_csv:
  csv_dataset_path: #"${data_path}/paper_training_dataset_reference/dataset.csv"
