package_path: "/home/tom/git_workspace/tesi/GrapheNet"
data_path: "${package_path}/data"
stock_csv_path: "${data_path}/original_xyz_files/original_dataset.csv"
path_xyz: "${data_path}/xyz_files/"
path_csv: "${path_xyz}/dataset.csv"
spath: "${data_path}/png_files"
dpath: "${data_path}/training_dataset/"
plot_distributions: True
features:
  [
    "ionization_potential",
    "electron_affinity",
    "electronegativity",
    "Fermi_energy",
    "formation_energy",
  ]
